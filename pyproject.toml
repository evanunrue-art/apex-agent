[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-cli"
version = "0.1.0"
description = "Next-Generation Autonomous CLI Agentic Assistant powered by LATS, Tiered Cognitive Memory, and Local/Cloud DGX Hybrid Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "textual>=0.40.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "tiktoken>=0.5.0",
    "pyyaml>=6.0"
]

[project.scripts]
apex = "apex.main:app"
